services:
  - type: web
    name: stickers-bot
    runtime: docker
    # Un disque persistant exige une instance payante sur Render.
    # Le plan gratuit efface la base SQLite lors des redéploiements.
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMINS
        sync: false
      - key: CREATOR_URL
        value: https://t.me/Shadow_sekai
      - key: CHANNEL_URL
        value: https://t.me/Shadow_sekai
      - key: GROUP_URL
        value: https://t.me/Shadow_sekai
      - key: DB_PATH
        value: /var/data/bot.db
    disk:
      name: stickers-data
      mountPath: /var/data
      sizeGB: 1
